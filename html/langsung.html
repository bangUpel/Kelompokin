<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelompokin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/pilih.css" />
    <link rel="icon" type="image/png" href="/image/logo.png"> 
  </head>

  <body class="container-md">

    <!-- navbar -->
    <nav>
      <div class="container-fluid">
        <a class="navbar-brand" href="https://ppdb.mamawar.sch.id/">
          <img src="/image/mamawar.png" alt="Logo"class="d-inline-block align-text-top">
        </a>
      </div>
    </nav>

    <!-- Default card -->
    <main id="default-card">
      <div class="card">
        <div class="card-header">
          <h2>
            <strong>
                KELOMPOK<span>IN</span>
            </strong>
          </h2>
        </div>
        <div class="card-body">

  
          <!-- Form -->
           <!-- buat manual -->
           <label>Input nama secara manual</label>
          <button id="manual" type="button" onclick="manual()" class="btn btn-primary w-100 mt-3">Input Manual</button>
          <figcaption class="figure-caption my-3 font-monospace shad opacity-75">atau</figcaption>
          <form id="formKelompok">
            <!-- Dropdown untuk memilih kelas -->
            <div class="mb-3">
              <label for="kelas" class="form-label">Pilih Kelas</label>
              <select id="kelas" class="form-select" required>
                <option value="" disabled selected>Pilih Kelas</option>
                
                <!-- Kelas X -->
                <option value="X.1">X.1</option>
                <option value="X.2">X.2</option>
                <option value="X.3">X.3</option>
                <option value="X.4">X.4</option>
                <option value="X.5">X.5</option>
                <option value="X.6">X.6</option>
                <option value="X.7">X.7</option>
                <option value="X.8">X.8</option>
                <option value="X.9">X.9</option>
                <option value="X.10">X.10</option>
                <option value="X.11">X.11</option>
                <option value="X.12">X.12</option>
                <option value="X.13">X.13</option>
              
                <!-- Kelas XI -->
                <option value="XI.1">XI.1</option>
                <option value="XI.2">XI.2</option>
                <option value="XI.3">XI.3</option>
                <option value="XI.4">XI.4</option>
                <option value="XI.5">XI.5</option>
                <option value="XI.6">XI.6</option>
                <option value="XI.7">XI.7</option>
                <option value="XI.8">XI.8</option>
                <option value="XI.9">XI.9</option>
                <option value="XI.10">XI.10</option>
                <option value="XI.11">XI.11</option>
                <option value="XI.12">XI.12</option>
                <option value="XI.13">XI.13</option>
              
                <!-- Kelas XII -->
                <option value="XII.1">XII.1</option>
                <option value="XII.2">XII.2</option>
                <option value="XII.3">XII.3</option>
                <option value="XII.4">XII.4</option>
                <option value="XII.5">XII.5</option>
                <option value="XII.6">XII.6</option>
                <option value="XII.7">XII.7</option>
                <option value="XII.8">XII.8</option>
                <option value="XII.9">XII.9</option>
                <option value="XII.10">XII.10</option>
                <option value="XII.11">XII.11</option>
                <option value="XII.12">XII.12</option>
                <option value="XII.13">XII.13</option>
              </select>
              
            </div>
  
            <!-- Input untuk jumlah kelompok -->
            <div class="mb-3">
              <label for="jumlahKelompok" class="form-label">Jumlah Kelompok</label>
              <input type="number" id="jumlahKelompok" class="form-control" min="2" max="15" placeholder="Jumlah kelompok" required>
            </div>
  
            <!-- Submit button -->
            <button type="submit" class="btn btn-primary w-100">Buat Kelompok</button>
          </form>
          
        </div>
      </div>
    </main>


    <!-- Manual Card -->
    <main id="manual-card">
      <div class="card">
        <div class="card-header">
          <h2>
            <strong>
              KELOMPOK<span>IN</span>
            </strong>
          </h2>
        </div>
        <div class="card-body">

  
          <!-- Form -->
           <!-- buat manual -->
            <form>
           <div class="mb-3">
            <label class="form-label">Masukkan nama</label>
            <textarea class="form-control" placeholder="pisahkan dengan tanda koma (contoh : Budi, Yono, siti, sri, ...)" rows="5" required></textarea>
            <br>
           </div>
           
  
            <!-- Input untuk jumlah kelompok -->
            <div class="mb-3">
              <label for="jumlahKelompok" class="form-label">Jumlah Kelompok</label>
              <input type="number" id="jumlahKelompok" class="form-control" min="2" max="15" placeholder="Jumlah kelompok" required>
            </div>
  
            <!-- Submit button -->
            <button type="submit" class="btn btn-primary w-100">Buat Kelompok</button>
          </form>
          
        </div>
      </div>
    </main>

    <div id="hasilKelompok" class="mt-3 container-fluid"></div>

     <button id="copyButton" class="btn btn-success mt-3 mb-5" style="display: none;">Copy Hasil</button>
     <br>
     <br>

      <!-- footer -->
      <footer id="footer">
        <p>Made with ❤ by XII.2</p>
      </footer>

      <script src="/javaScript/langsung.js"></script>
  </body>
</html>
